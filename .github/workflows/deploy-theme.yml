name: Deploy Theme
on:
    push:
        branches:
            - master
            - main
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Download Typesense Search UI
              run: |
                  mkdir -p assets/js
                  curl -fsSL https://unpkg.com/@magicpages/ghost-typesense-search-ui/dist/search.min.js -o assets/js/search.min.js

            - name: Zip theme
              run: |
                  zip -r -y headline.zip . \
                    -x '*.git*' '*.zip' 'yarn*' 'npm*' 'pnpm*' 'node_modules*' \
                       'AGENTS.md' 'CLAUDE.md' 'pnpm-workspace.yaml' \
                       '*routes.yaml' '*redirects.yaml' '*redirects.json'

            - name: Upload & activate theme
              env:
                  API: ${{ secrets.GHOST_ADMIN_API_URL }}
                  KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
              run: |
                  RESP=$(curl -fsSL -X POST \
                    -H "Authorization: Ghost $KEY" \
                    -H "Accept-Version: v6.0" \
                    -F "file=@headline.zip;type=application/zip" \
                    "$API/themes/upload/")
                  echo "Upload response: $RESP"
                  NAME=$(echo "$RESP" | jq -r '.themes[0].name // "headline"')
                  echo "Activating theme: $NAME"
                  curl -fsSL -X PUT \
                    -H "Authorization: Ghost $KEY" \
                    -H "Accept-Version: v6.0" \
                    "$API/themes/$NAME/activate/"
