name: Deploy Theme
on:
    push:
        branches:
            - master
            - main
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Download Typesense Search UI
              run: |
                  mkdir -p assets/js
                  curl -fsSL https://unpkg.com/@magicpages/ghost-typesense-search-ui/dist/search.min.js -o assets/js/search.min.js

            - name: Zip theme
              run: |
                  zip -r -y headline.zip . \
                    -x '*.git*' '*.zip' 'yarn*' 'npm*' 'pnpm*' 'node_modules*' \
                       'AGENTS.md' 'CLAUDE.md' 'pnpm-workspace.yaml' \
                       '*routes.yaml' '*redirects.yaml' '*redirects.json'

            - name: Upload & activate theme
              env:
                  API: ${{ secrets.GHOST_ADMIN_API_URL }}
                  KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
              run: |
                  ID="${KEY%%:*}"
                  SECRET_B64="${KEY#*:}"
                  DEC=$(printf '%s' "$SECRET_B64" | base64 -d 2>/dev/null || printf '%s' "$SECRET_B64")
                  NOW=$(date +%s)
                  EXP=$((NOW+300))
                  HEADER=$(printf '{"alg":"HS256","typ":"JWT","kid":"%s"}' "$ID" | base64 -w0 | tr -d '=' | tr '+' '-' | tr '/' '_')
                  PAYLOAD=$(printf '{"iat":%s,"exp":%s,"aud":"/admin/"}' "$NOW" "$EXP" | base64 -w0 | tr -d '=' | tr '+' '-' | tr '/' '_')
                  SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -hmac "$DEC" -binary | base64 -w0 | tr -d '=' | tr '+' '-' | tr '/' '_')
                  JWT="$HEADER.$PAYLOAD.$SIG"
                  AUTH="Ghost $JWT"
                  BASE="${API%/}"
                  RESP=$(curl -fsSL -X POST \
                    -H "Authorization: $AUTH" \
                    -H "Accept-Version: v6.0" \
                    -F "file=@headline.zip;type=application/zip" \
                    "$BASE/themes/upload/")
                  echo "UPLOAD $RESP"
                  NAME=$(echo "$RESP" | jq -r '.themes[0].name // "headline"')
                  echo "ACTIVATE $NAME"
                  curl -fsSL -X PUT \
                    -H "Authorization: $AUTH" \
                    -H "Accept-Version: v6.0" \
                    "$BASE/themes/$NAME/activate/"
